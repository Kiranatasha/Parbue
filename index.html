<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PARBUE - Cinematic Intro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      width: 100%;
      height: 100vh;
      font-family: "Space Grotesk", sans-serif;
      overflow: hidden;
      background: linear-gradient(
        135deg,
        #0a0e1a 0%,
        #0f1428 25%,
        #131d3a 50%,
        #0a0e1a 75%,
        #050810 100%
      );
    }

    /* Cinematic background glow */
    .background-glow {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .glow-center {
      position: absolute;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(
        circle,
        rgba(59, 130, 246, 0.15) 0%,
        rgba(14, 165, 233, 0.08) 25%,
        transparent 70%
      );
      border-radius: 50%;
      filter: blur(80px);
      animation: glowPulse 8s ease-in-out infinite;
    }

    .glow-accent {
      position: absolute;
      right: -200px;
      top: -100px;
      width: 600px;
      height: 600px;
      background: radial-gradient(
        circle,
        rgba(125, 211, 252, 0.08) 0%,
        transparent 60%
      );
      border-radius: 50%;
      filter: blur(60px);
      animation: glowShift 12s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% {
        opacity: 0.6;
        transform: translate(-50%, -50%) scale(1);
      }
      50% {
        opacity: 0.8;
        transform: translate(-50%, -50%) scale(1.05);
      }
    }

    @keyframes glowShift {
      0%, 100% {
        opacity: 0.4;
      }
      50% {
        opacity: 0.6;
      }
    }

    /* Particles */
    .particles-container {
      position: absolute;
      inset: 0;
      z-index: 2;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      animation: float linear infinite;
    }

    .particle.small {
      width: 1px;
      height: 1px;
      background: rgba(125, 211, 252, 0.4);
    }

    .particle.medium {
      width: 2px;
      height: 2px;
      background: rgba(255, 255, 255, 0.5);
    }

    .particle.large {
      width: 3px;
      height: 3px;
      background: rgba(125, 211, 252, 0.6);
    }

    @keyframes float {
      0% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) translateX(var(--drift, 0px));
        opacity: 0;
      }
    }

    /* Main content */
    .intro-container {
      position: relative;
      z-index: 3;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    .intro-content {
      text-align: center;
      max-width: 900px;
      padding: 0 40px;
    }

    /* Title */
    .intro-title {
      font-size: clamp(4rem, 15vw, 12rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
      line-height: 1;
      margin: 0;
      text-transform: uppercase;
      font-family: "Space Grotesk", sans-serif;
      animation: titleFadeIn 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      opacity: 0;
    }

    @keyframes titleFadeIn {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Glow under title */
    .title-glow {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 200px;
      background: radial-gradient(
        ellipse at center,
        rgba(59, 130, 246, 0.3) 0%,
        transparent 70%
      );
      filter: blur(40px);
      opacity: 0;
      animation: glowAppear 1.5s ease-out 0.3s forwards;
      pointer-events: none;
      margin-top: -100px;
    }

    @keyframes glowAppear {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

    /* Subtitle */
    .intro-subtitle {
      font-size: clamp(1rem, 4vw, 1.5rem);
      font-weight: 300;
      letter-spacing: 0.01em;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 24px;
      margin-bottom: 48px;
      line-height: 1.6;
      animation: subtitleFadeIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.4s forwards;
      opacity: 0;
    }

    @keyframes subtitleFadeIn {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Button */
    .intro-button {
      padding: 16px 48px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      cursor: pointer;
      border-radius: 8px;
      text-transform: uppercase;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      animation: buttonFadeIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.6s forwards;
      opacity: 0;
      position: relative;
      overflow: hidden;
      font-family: inherit;
    }

    @keyframes buttonFadeIn {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .intro-button::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        circle at center,
        rgba(59, 130, 246, 0.4) 0%,
        transparent 70%
      );
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    .intro-button:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(125, 211, 252, 0.6);
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.3), inset 0 0 20px rgba(59, 130, 246, 0.1);
      transform: translateY(-2px);
    }

    .intro-button:hover::before {
      opacity: 1;
    }

    .intro-button:active {
      transform: translateY(0);
    }

    /* Page transition */
    .intro-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      z-index: 100;
    }

    .intro-wrapper.exit {
      opacity: 0;
      transform: scale(1.05);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .intro-title {
        font-size: clamp(2.5rem, 12vw, 4rem);
      }

      .intro-subtitle {
        font-size: 1rem;
        margin-top: 20px;
        margin-bottom: 36px;
      }

      .intro-button {
        padding: 14px 36px;
        font-size: 0.9rem;
      }

      .glow-center {
        width: 600px;
        height: 600px;
      }
    }
  </style>
</head>
<body>
  <div class="intro-wrapper">
    <!-- Cinematic Background -->
    <div class="background-glow">
      <div class="glow-center"></div>
      <div class="glow-accent"></div>
    </div>

    <!-- Particles -->
    <div class="particles-container" id="particlesContainer"></div>

    <!-- Main Content -->
    <div class="intro-container">
      <div class="intro-content">
        <div style="position: relative; display: inline-block;">
          <h1 class="intro-title">PARBUE</h1>
          <div class="title-glow"></div>
        </div>
        <p class="intro-subtitle">Are you ready to elevate your brand?</p>
        <button class="intro-button" id="readyBtn">I'm Ready</button>
      </div>
    </div>
  </div>

  <script>
    // Generate particles
    function createParticles() {
      const container = document.getElementById('particlesContainer');
      const particleCount = window.innerWidth > 768 ? 120 : 60;

      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';

        // Randomly assign size classes
        const sizeRoll = Math.random();
        if (sizeRoll < 0.5) {
          particle.classList.add('small');
        } else if (sizeRoll < 0.85) {
          particle.classList.add('medium');
        } else {
          particle.classList.add('large');
        }

        // Position particles mostly in lower half
        const x = Math.random() * window.innerWidth;
        const y = window.innerHeight * 0.4 + Math.random() * window.innerHeight * 0.6;

        particle.style.left = x + 'px';
        particle.style.top = y + 'px';

        // Random animation duration (8-16s)
        const duration = 8 + Math.random() * 8;
        particle.style.animationDuration = duration + 's';

        // Random delay
        const delay = Math.random() * 2;
        particle.style.animationDelay = delay + 's';

        // Random horizontal drift
        const drift = (Math.random() - 0.5) * 100;
        particle.style.setProperty('--drift', drift + 'px');

        container.appendChild(particle);
      }
    }

    // Handle button click
    document.getElementById('readyBtn').addEventListener('click', () => {
      const wrapper = document.querySelector('.intro-wrapper');
      wrapper.classList.add('exit');

      setTimeout(() => {
        // Redirect to main landing page
        window.location.href = 'landing.html';
      }, 800);
    });

    // Allow Enter key to trigger button
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('readyBtn').click();
      }
    });

    // Initialize particles on load
    window.addEventListener('load', createParticles);

    // Regenerate particles on resize
    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        document.getElementById('particlesContainer').innerHTML = '';
        createParticles();
      }, 250);
    });
  </script>
</body>
</html>
